name: Almost Human Upload Status Beacon

on:
  push:
    branches: [master]
    paths:
      - '.github/run-almost-human-upload-status.json'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Read bridge workflow statuses
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/almost-human-testflight-bridge.yml/runs?per_page=10" > /tmp/runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload=json.load(open('/tmp/runs.json'))
          rows=[]
          for r in payload.get('workflow_runs',[]):
            rows.append({
              'id':r.get('id'),
              'status':r.get('status'),
              'conclusion':r.get('conclusion'),
              'event':r.get('event'),
              'headSha':r.get('head_sha'),
              'createdAt':r.get('created_at'),
              'updatedAt':r.get('updated_at'),
              'runAttempt':r.get('run_attempt'),
              'htmlUrl':r.get('html_url')
            })
          Path('ALMOST_HUMAN_UPLOAD_RUN_STATUS.json').write_text(json.dumps({'workflow':'almost-human-testflight-bridge.yml','runs':rows},indent=2)+'\n')
          PY

      - name: Save sanitized status receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Status Beacon'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add ALMOST_HUMAN_UPLOAD_RUN_STATUS.json
          git commit -m 'Record Almost Human upload workflow status'
          git pull --rebase --autostash origin master
          git push origin HEAD:master
