name: Almost Human TestFlight Access Check

on:
  push:
    branches: [master]
    paths:
      - '.github/run-almost-human-testflight-access.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate read-only request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('.github/run-almost-human-testflight-access.json'))
          assert t['operation']=='READ_ONLY_TESTFLIGHT_ACCESS'
          assert str(t['ascAppId'])=='6796814542'
          assert t['testerEmail']=='wscott2k8@gmail.com'
          assert t['buildsAuthorized']==0
          assert t['uploadsAuthorized']==0
          assert t['testerChangesAuthorized']==0
          PY

      - name: Query internal groups builds and tester access
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path
          import jwt

          app_id='6796814542'
          tester_email='wscott2k8@gmail.com'
          target_build_id='134dbe23-97ef-4fca-bcfc-18b744f612ee'
          key=os.environ['APP_STORE_CONNECT_API_KEY'].replace('\\n','\n')
          token=jwt.encode(
            {'iss':os.environ['APP_STORE_CONNECT_ISSUER_ID'],'iat':int(time.time()),'exp':int(time.time())+900,'aud':'appstoreconnect-v1'},
            key,algorithm='ES256',headers={'kid':os.environ['APP_STORE_CONNECT_KEY_ID'],'typ':'JWT'})
          headers={'Authorization':f'Bearer {token}'}

          def get(path, params=None):
            url='https://api.appstoreconnect.apple.com'+path
            if params: url += '?' + urllib.parse.urlencode(params)
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
              return json.load(r)

          try:
            group_payload=get('/v1/betaGroups',{'filter[app]':app_id,'limit':'200'})
            groups=[]
            for g in group_payload.get('data',[]):
              a=g.get('attributes',{})
              gid=g['id']
              build_ids=[x['id'] for x in get(f'/v1/betaGroups/{gid}/relationships/builds',{'limit':'200'}).get('data',[])]
              tester_ids=[x['id'] for x in get(f'/v1/betaGroups/{gid}/relationships/betaTesters',{'limit':'200'}).get('data',[])]
              groups.append({
                'id':gid,
                'name':a.get('name'),
                'isInternalGroup':a.get('isInternalGroup'),
                'hasAccessToAllBuilds':a.get('hasAccessToAllBuilds'),
                'buildIds':build_ids,
                'containsTargetBuild':target_build_id in build_ids,
                'testerIds':tester_ids
              })

            tester_payload=get('/v1/betaTesters',{'filter[email]':tester_email,'limit':'200'})
            testers=[]
            for t in tester_payload.get('data',[]):
              a=t.get('attributes',{})
              testers.append({'id':t['id'],'email':a.get('email'),'firstName':a.get('firstName'),'lastName':a.get('lastName'),'inviteType':a.get('inviteType'),'state':a.get('state')})

            internal=[g for g in groups if g.get('isInternalGroup')]
            automatic=[g for g in internal if g.get('hasAccessToAllBuilds')]
            tester_ids={t['id'] for t in testers}
            explicit=[g for g in internal if tester_ids.intersection(g.get('testerIds',[])) and (g.get('hasAccessToAllBuilds') or g.get('containsTargetBuild'))]
            result={
              'status':'ACCESS_CONFIRMED' if automatic or explicit else 'TESTER_ASSIGNMENT_NEEDED',
              'ascAppId':app_id,
              'bundleId':'com.stormandme.almosthuman',
              'appVersion':'1.0.0',
              'buildNumber':'2',
              'appleBuildResourceId':target_build_id,
              'testerEmail':tester_email,
              'groups':groups,
              'matchingTesters':testers,
              'automaticInternalGroupCount':len(automatic),
              'explicitEligibleGroupCount':len(explicit),
              'buildsRun':0,
              'uploadsRun':0,
              'testerChangesRun':0
            }
          except Exception as e:
            result={'status':'ERROR','ascAppId':app_id,'testerEmail':tester_email,'buildsRun':0,'uploadsRun':0,'testerChangesRun':0,'errorType':type(e).__name__,'error':str(e)}
          Path('ALMOST_HUMAN_TESTFLIGHT_ACCESS.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Save sanitized access receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human TestFlight Access'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add ALMOST_HUMAN_TESTFLIGHT_ACCESS.json
          git commit -m 'Record Almost Human TestFlight tester access'
          git pull --rebase --autostash origin master
          git push origin HEAD:master
