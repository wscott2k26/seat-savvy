name: Almost Human Build 4 Lane Status

on:
  push:
    branches: [master]
    paths:
      - '.github/run-almost-human-build4-lane-status.json'

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate read-only request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          t=json.load(open('.github/run-almost-human-build4-lane-status.json'))
          assert t['operation']=='READ_ONLY_BUILD4_LANE_STATUS'
          assert t['buildsAuthorized']==0
          assert t['uploadsAuthorized']==0
          PY

      - name: Read exact workflow status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/almost-human-build4-testflight.yml/runs?per_page=5" > /tmp/runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload=json.load(open('/tmp/runs.json'))
          rows=[]
          for run in payload.get('workflow_runs',[]):
              rows.append({
                'runId':run.get('id'),
                'status':run.get('status'),
                'conclusion':run.get('conclusion'),
                'event':run.get('event'),
                'headSha':run.get('head_sha'),
                'createdAt':run.get('created_at'),
                'updatedAt':run.get('updated_at'),
                'htmlUrl':run.get('html_url'),
                'runAttempt':run.get('run_attempt')
              })
          result={'operation':'READ_ONLY_BUILD4_LANE_STATUS','buildsRun':0,'uploadsRun':0,'runs':rows}
          Path('ALMOST_HUMAN_BUILD4_LANE_STATUS.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Save sanitized status beacon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Build 4 Status'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add ALMOST_HUMAN_BUILD4_LANE_STATUS.json
          git commit -m 'Record Almost Human build 4 TestFlight lane status'
          git pull --rebase --autostash origin master
          git push origin HEAD:master
