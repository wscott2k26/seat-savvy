name: Almost Human Build 3 TestFlight

on:
  push:
    branches: [master]
    paths:
      - '.github/run-almost-human-build3-testflight.json'

permissions:
  contents: write
  issues: write

concurrency:
  group: almost-human-build3-testflight
  cancel-in-progress: false

env:
  EXPECTED_ASC_APP_ID: '6796814542'
  EXPECTED_BUNDLE_ID: com.stormandme.almosthuman
  EXPECTED_EAS_BUILD_ID: 61c38061-c2e0-43f5-b8a2-43b0af8cd187
  EXPECTED_APP_VERSION: 1.0.0
  EXPECTED_BUILD_NUMBER: '3'
  EXPECTED_GROUP_ID: 7ceafcdb-7c5d-4a72-befa-40a309015945
  EXPECTED_TESTER_ID: 0ec01933-8004-4bc5-a904-9a4e3f655779
  EXPECTED_TESTER_EMAIL: wscott2k8@gmail.com
  IPA_URL: https://expo.dev/artifacts/eas/258-2wskspA4dNa6KseKZzRR5xt9uyXO3ltt6Vctsac.ipa

jobs:
  upload-exact-build3:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out credential-bearing release repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate exact one-upload authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          t=json.loads(Path('.github/run-almost-human-build3-testflight.json').read_text())
          assert t['operation']=='UPLOAD_BUILD3_ONCE'
          assert t['confirm']=='UPLOAD_BUILD3_ONCE'
          assert str(t['ascAppId'])==os.environ['EXPECTED_ASC_APP_ID']
          assert t['bundleId']==os.environ['EXPECTED_BUNDLE_ID']
          assert t['easBuildId']==os.environ['EXPECTED_EAS_BUILD_ID']
          assert t['appVersion']==os.environ['EXPECTED_APP_VERSION']
          assert str(t['buildNumber'])==os.environ['EXPECTED_BUILD_NUMBER']
          assert t['newBuildsAuthorized']==0
          assert t['testFlightUploadsAuthorized']==1
          assert t['publicReleaseAuthorized']==0
          assert t['internalGroupBuildAttachmentAuthorized']==1
          assert t['testerAssignmentsAuthorized']==0

          lookup=json.loads(Path('ALMOST_HUMAN_ASC_LOOKUP_FAST.json').read_text())
          assert lookup['status']=='PASSED'
          assert lookup['matchCount']==1
          match=lookup['matches'][0]
          assert str(match['id'])==os.environ['EXPECTED_ASC_APP_ID']
          assert match['bundleId']==os.environ['EXPECTED_BUNDLE_ID']
          assert match['name']=='Almost Human: The Haven'

          old=json.loads(Path('ALMOST_HUMAN_TESTFLIGHT_UPLOAD_RECORD.json').read_text())
          assert old['status']=='UPLOAD_ACCEPTED_BY_APPLE'
          assert str(old['buildNumber'])=='2'
          assert old['easBuildId']!='61c38061-c2e0-43f5-b8a2-43b0af8cd187'

          internal=json.loads(Path('ALMOST_HUMAN_INTERNAL_TESTING_RECORD.json').read_text())
          assert internal['status']=='INTERNAL_TESTING_ENABLED'
          assert internal['groupId']==os.environ['EXPECTED_GROUP_ID']
          assert internal['testerId']==os.environ['EXPECTED_TESTER_ID']
          assert internal['testerEmail']==os.environ['EXPECTED_TESTER_EMAIL']
          assert internal['isInternalGroup'] is True
          print('Exact build 3, Apple app, internal group, and one-upload authorization verified.')
          PY

      - name: Refuse duplicate build 3 upload
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ALMOST_HUMAN_BUILD3_TESTFLIGHT_UPLOAD_RECORD.json ]]; then
            python3 - <<'PY'
          import json
          r=json.load(open('ALMOST_HUMAN_BUILD3_TESTFLIGHT_UPLOAD_RECORD.json'))
          if r.get('status')=='UPLOAD_ACCEPTED_BY_APPLE' and str(r.get('buildNumber'))=='3':
              raise SystemExit('Build 3 already has an Apple-accepted upload receipt; refusing duplicate upload.')
          PY
          fi

      - name: Verify Apple API secrets without exposing them
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "${APP_STORE_CONNECT_API_KEY:-}"
          test -n "${APP_STORE_CONNECT_KEY_ID:-}"
          test -n "${APP_STORE_CONNECT_ISSUER_ID:-}"
          echo 'Apple API secret presence verified.'

      - name: Download and verify exact signed build 3 IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/AlmostHuman-1.0.0-3.ipa"
          curl --fail --location --retry 3 --output "$IPA" "$IPA_URL"
          test -s "$IPA"
          shasum -a 256 "$IPA" | tee "$RUNNER_TEMP/ipa.sha256"
          unzip -p "$IPA" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")
          test "$BUNDLE" = "$EXPECTED_BUNDLE_ID"
          test "$VERSION" = "$EXPECTED_APP_VERSION"
          test "$BUILD" = "$EXPECTED_BUILD_NUMBER"
          echo "Exact IPA identity verified: $BUNDLE $VERSION ($BUILD)"

      - name: Prepare existing App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Upload exact existing build 3 IPA to Apple
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/AlmostHuman-1.0.0-3.ipa"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          grep -Eqi 'success|uploaded|No errors uploading' "$RUNNER_TEMP/altool.log"
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          ipa=Path(os.environ['RUNNER_TEMP'])/'AlmostHuman-1.0.0-3.ipa'
          result={
            'status':'UPLOAD_ACCEPTED_BY_APPLE',
            'bundleId':os.environ['EXPECTED_BUNDLE_ID'],
            'appVersion':os.environ['EXPECTED_APP_VERSION'],
            'buildNumber':os.environ['EXPECTED_BUILD_NUMBER'],
            'easBuildId':os.environ['EXPECTED_EAS_BUILD_ID'],
            'ascAppId':os.environ['EXPECTED_ASC_APP_ID'],
            'ipaSha256':hashlib.sha256(ipa.read_bytes()).hexdigest(),
            'newBuildsRun':0,
            'testFlightUploadsRun':1,
            'publicReleasesRun':0,
            'note':'Apple accepted the exact existing Almost Human 1.0.0 (3) IPA for TestFlight processing.'
          }
          Path('ALMOST_HUMAN_BUILD3_TESTFLIGHT_UPLOAD_RECORD.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Save sanitized build 3 upload receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Build 3 Upload'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add ALMOST_HUMAN_BUILD3_TESTFLIGHT_UPLOAD_RECORD.json
          git commit -m 'Record Almost Human build 3 TestFlight upload acceptance'
          git pull --rebase --autostash origin master
          git push origin HEAD:master

  validate-and-enable-internal-testing:
    needs: upload-exact-build3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out latest accepted-upload receipt
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Verify exact upload receipt and zero-build boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          r=json.load(open('ALMOST_HUMAN_BUILD3_TESTFLIGHT_UPLOAD_RECORD.json'))
          assert r['status']=='UPLOAD_ACCEPTED_BY_APPLE'
          assert r['bundleId']==os.environ['EXPECTED_BUNDLE_ID']
          assert r['appVersion']==os.environ['EXPECTED_APP_VERSION']
          assert str(r['buildNumber'])==os.environ['EXPECTED_BUILD_NUMBER']
          assert r['easBuildId']==os.environ['EXPECTED_EAS_BUILD_ID']
          assert str(r['ascAppId'])==os.environ['EXPECTED_ASC_APP_ID']
          assert r['newBuildsRun']==0
          assert r['testFlightUploadsRun']==1
          assert r['publicReleasesRun']==0
          PY

      - name: Wait for Apple validation and attach build 3 to existing internal group
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path
          import jwt

          app_id=os.environ['EXPECTED_ASC_APP_ID']
          bundle_id=os.environ['EXPECTED_BUNDLE_ID']
          app_version=os.environ['EXPECTED_APP_VERSION']
          build_number=os.environ['EXPECTED_BUILD_NUMBER']
          group_id=os.environ['EXPECTED_GROUP_ID']
          tester_id=os.environ['EXPECTED_TESTER_ID']
          tester_email=os.environ['EXPECTED_TESTER_EMAIL']

          key=os.environ['APP_STORE_CONNECT_API_KEY'].replace('\\n','\n')
          token=jwt.encode(
            {'iss':os.environ['APP_STORE_CONNECT_ISSUER_ID'],'iat':int(time.time()),'exp':int(time.time())+1200,'aud':'appstoreconnect-v1'},
            key,algorithm='ES256',headers={'kid':os.environ['APP_STORE_CONNECT_KEY_ID'],'typ':'JWT'})
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}

          def request(method,path,params=None,body=None,accepted=(200,201,204)):
            url='https://api.appstoreconnect.apple.com'+path
            if params: url += '?' + urllib.parse.urlencode(params)
            data=json.dumps(body).encode() if body is not None else None
            req=urllib.request.Request(url,headers=headers,data=data,method=method)
            try:
              with urllib.request.urlopen(req,timeout=30) as response:
                raw=response.read()
                return response.status, (json.loads(raw) if raw else None)
            except urllib.error.HTTPError as error:
              raw=error.read().decode(errors='replace')
              try: payload=json.loads(raw) if raw else None
              except Exception: payload={'raw':raw[:1200]}
              if error.code in accepted:
                return error.code,payload
              raise RuntimeError(f'{method} {path} failed HTTP {error.code}: {json.dumps(payload)[:1600]}')

          def get(path,params=None): return request('GET',path,params=params,accepted=(200,))[1]

          exact=None
          last_rows=[]
          for attempt in range(60):
            payload=get('/v1/builds',{
              'filter[app]':app_id,
              'filter[version]':build_number,
              'include':'preReleaseVersion,buildBetaDetail',
              'limit':'10'
            })
            included={item['id']:item for item in payload.get('included',[])}
            rows=[]
            for build in payload.get('data',[]):
              attrs=build.get('attributes',{})
              rel=build.get('relationships',{})
              pre_id=((rel.get('preReleaseVersion') or {}).get('data') or {}).get('id')
              beta_id=((rel.get('buildBetaDetail') or {}).get('data') or {}).get('id')
              pre=(included.get(pre_id) or {}).get('attributes',{})
              beta=(included.get(beta_id) or {}).get('attributes',{})
              rows.append({
                'appleBuildResourceId':build.get('id'),
                'buildNumber':attrs.get('version'),
                'processingState':attrs.get('processingState'),
                'uploadedDate':attrs.get('uploadedDate'),
                'expired':attrs.get('expired'),
                'minOsVersion':attrs.get('minOsVersion'),
                'appVersion':pre.get('version'),
                'platform':pre.get('platform'),
                'internalBuildState':beta.get('internalBuildState'),
                'externalBuildState':beta.get('externalBuildState')
              })
            last_rows=rows
            matches=[row for row in rows if str(row.get('buildNumber'))==build_number and row.get('appVersion')==app_version]
            if matches:
              candidate=matches[0]
              if candidate.get('processingState') in ('FAILED','INVALID'):
                raise RuntimeError(f'Apple rejected build 3: {candidate}')
              if candidate.get('processingState')=='VALID' and candidate.get('internalBuildState') in ('READY_FOR_BETA_TESTING','IN_BETA_TESTING'):
                exact=candidate
                break
            print(f'Apple processing check {attempt+1}/60: {matches or rows}')
            time.sleep(20)

          if exact is None:
            raise RuntimeError(f'Build 3 was uploaded but did not become internally testable within 20 minutes. Last Apple rows: {last_rows}')

          build_id=exact['appleBuildResourceId']
          group=get(f'/v1/betaGroups/{group_id}')['data']
          group_attrs=group.get('attributes',{})
          if group_attrs.get('name')!='Almost Human Internal Testers' or group_attrs.get('isInternalGroup') is not True:
            raise RuntimeError('The expected internal tester group identity changed.')

          existing_build_ids=[item['id'] for item in get(f'/v1/betaGroups/{group_id}/relationships/builds',{'limit':'200'}).get('data',[])]
          build_added=False
          if build_id not in existing_build_ids:
            request('POST',f'/v1/betaGroups/{group_id}/relationships/builds',body={'data':[{'type':'builds','id':build_id}]},accepted=(204,409))
            build_added=True

          final_build_ids=[item['id'] for item in get(f'/v1/betaGroups/{group_id}/relationships/builds',{'limit':'200'}).get('data',[])]
          tester_ids=[item['id'] for item in get(f'/v1/betaGroups/{group_id}/relationships/betaTesters',{'limit':'200'}).get('data',[])]
          if build_id not in final_build_ids:
            raise RuntimeError('Apple build 3 was not attached to the internal tester group.')
          if tester_id not in tester_ids:
            raise RuntimeError('The existing authorized tester is no longer attached; no tester reassignment was authorized.')

          result={
            'status':'READY_FOR_INTERNAL_TESTING',
            'ascAppId':app_id,
            'bundleId':bundle_id,
            'appVersion':app_version,
            'buildNumber':build_number,
            'easBuildId':os.environ['EXPECTED_EAS_BUILD_ID'],
            'appleBuildResourceId':build_id,
            'processingState':exact.get('processingState'),
            'internalBuildState':exact.get('internalBuildState'),
            'externalBuildState':exact.get('externalBuildState'),
            'groupId':group_id,
            'groupName':group_attrs.get('name'),
            'isInternalGroup':group_attrs.get('isInternalGroup'),
            'hasAccessToAllBuilds':group_attrs.get('hasAccessToAllBuilds'),
            'buildAttached':True,
            'buildAddedThisRun':build_added,
            'testerId':tester_id,
            'testerEmail':tester_email,
            'testerAlreadyAttached':True,
            'newBuildsRun':0,
            'testFlightUploadsRun':1,
            'publicReleasesRun':0,
            'testerAssignmentsRun':0,
            'note':'Almost Human 1.0.0 (3) is Apple-valid and available to the existing private internal tester.'
          }
          Path('ALMOST_HUMAN_BUILD3_TESTFLIGHT_READY_RECORD.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Save sanitized ready-to-test receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Build 3 TestFlight'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add ALMOST_HUMAN_BUILD3_TESTFLIGHT_READY_RECORD.json
          git commit -m 'Record Almost Human build 3 ready for internal TestFlight'
          git pull --rebase --autostash origin master
          git push origin HEAD:master

      - name: Report exact blocker without re-uploading
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Almost Human build 3 TestFlight needs attention — run $GITHUB_RUN_ID" --body "The exact build 3 lane stopped after at most one upload. Do not upload again blindly. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
