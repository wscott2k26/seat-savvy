name: Almost Human Exact TestFlight Bridge

on:
  push:
    branches: [master]
    paths:
      - '.github/run-almost-human-testflight.json'

permissions:
  contents: write

concurrency:
  group: almost-human-exact-testflight-bridge
  cancel-in-progress: false

jobs:
  verify-and-upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXPECTED_ASC_APP_ID: '6796814542'
      EXPECTED_BUNDLE_ID: com.stormandme.almosthuman
      EXPECTED_BUILD_ID: a83059b6-7063-4b96-bf40-e5c95e1bbe29
      EXPECTED_APP_VERSION: 1.0.0
      EXPECTED_BUILD_NUMBER: '2'
      IPA_URL: https://expo.dev/artifacts/eas/vi7zgg5AG6MNnYAfsjhjW3sXRfx6QYGdSBaceKHl4SQ.ipa

    steps:
      - name: Check out credential-bearing release repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate exact one-upload authorization
        id: authorize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          t=json.loads(Path('.github/run-almost-human-testflight.json').read_text())
          assert t['operation']=='UPLOAD_EXISTING_IPA_ONCE'
          assert t['confirm']=='UPLOAD_EXISTING_IPA_ONCE'
          assert str(t['ascAppId'])==os.environ['EXPECTED_ASC_APP_ID']
          assert t['bundleId']==os.environ['EXPECTED_BUNDLE_ID']
          assert t['easBuildId']==os.environ['EXPECTED_BUILD_ID']
          assert t['appVersion']==os.environ['EXPECTED_APP_VERSION']
          assert str(t['buildNumber'])==os.environ['EXPECTED_BUILD_NUMBER']
          assert t['newBuildsAuthorized']==0
          assert t['testFlightUploadsAuthorized']==1

          lookup=json.loads(Path('ALMOST_HUMAN_ASC_LOOKUP_FAST.json').read_text())
          assert lookup['status']=='PASSED'
          assert lookup['bundleId']==os.environ['EXPECTED_BUNDLE_ID']
          assert lookup['matchCount']==1
          match=lookup['matches'][0]
          assert str(match['id'])==os.environ['EXPECTED_ASC_APP_ID']
          assert match['bundleId']==os.environ['EXPECTED_BUNDLE_ID']
          assert match['name']=='Almost Human: The Haven'
          print('Exact App Store Connect identity and upload authorization verified.')
          PY
          echo "asc_app_id=$EXPECTED_ASC_APP_ID" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate accepted upload
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ALMOST_HUMAN_TESTFLIGHT_UPLOAD_RECORD.json ]]; then
            python3 - <<'PY'
          import json
          r=json.load(open('ALMOST_HUMAN_TESTFLIGHT_UPLOAD_RECORD.json'))
          if r.get('status')=='UPLOAD_ACCEPTED_BY_APPLE':
              raise SystemExit('This exact IPA already has an Apple-accepted upload receipt; refusing duplicate upload.')
          PY
          fi

      - name: Verify Apple API secrets are available without exposing them
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "${APP_STORE_CONNECT_API_KEY:-}"
          test -n "${APP_STORE_CONNECT_KEY_ID:-}"
          test -n "${APP_STORE_CONNECT_ISSUER_ID:-}"
          echo 'Apple API secret presence verified.'

      - name: Download and verify exact signed IPA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/AlmostHuman-1.0.0-2.ipa" "$IPA_URL"
          test -s "$RUNNER_TEMP/AlmostHuman-1.0.0-2.ipa"
          shasum -a 256 "$RUNNER_TEMP/AlmostHuman-1.0.0-2.ipa" | tee "$RUNNER_TEMP/ipa.sha256"
          unzip -p "$RUNNER_TEMP/AlmostHuman-1.0.0-2.ipa" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")
          test "$BUNDLE" = "$EXPECTED_BUNDLE_ID"
          test "$VERSION" = "$EXPECTED_APP_VERSION"
          test "$BUILD" = "$EXPECTED_BUILD_NUMBER"
          echo "Exact IPA identity verified: $BUNDLE $VERSION ($BUILD)"

      - name: Prepare existing App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Upload exact existing IPA to App Store Connect TestFlight
        id: upload
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_APP_ID: ${{ steps.authorize.outputs.asc_app_id }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/AlmostHuman-1.0.0-2.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          grep -Eqi 'success|uploaded|No errors uploading' "$RUNNER_TEMP/altool.log"
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          ipa=Path(os.environ['RUNNER_TEMP'])/'AlmostHuman-1.0.0-2.ipa'
          result={
            'status':'UPLOAD_ACCEPTED_BY_APPLE',
            'bundleId':os.environ['EXPECTED_BUNDLE_ID'],
            'appVersion':os.environ['EXPECTED_APP_VERSION'],
            'buildNumber':os.environ['EXPECTED_BUILD_NUMBER'],
            'easBuildId':os.environ['EXPECTED_BUILD_ID'],
            'ascAppId':os.environ['ASC_APP_ID'],
            'ipaSha256':hashlib.sha256(ipa.read_bytes()).hexdigest(),
            'newBuildsRun':0,
            'testFlightUploadsRun':1,
            'note':'Apple accepted the exact existing IPA for App Store Connect processing. TestFlight visibility follows Apple processing.'
          }
          Path('ALMOST_HUMAN_TESTFLIGHT_UPLOAD_RECORD.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Save sanitized upload receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Almost Human Release Bridge'
          git config user.email 'wscott2k26@users.noreply.github.com'
          git add ALMOST_HUMAN_TESTFLIGHT_UPLOAD_RECORD.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No accepted-upload receipt produced.'
          else
            git commit -m 'Record Almost Human TestFlight upload acceptance'
            git pull --rebase --autostash origin master
            git push origin HEAD:master
          fi
